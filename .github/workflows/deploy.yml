name: Deploy to VPS

on:
  push:
    branches:
      - main
  # Memungkinkan kamu menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Menjalankan perintah di VPS
          script: |
            # Masuk ke direktori aplikasi
            cd /var/www/ads-aggregator
            
            # Tarik kode terbaru dari branch main
            git pull origin main
            
            # Update dependencies composer (jika ada)
            composer install --no-dev --optimize-autoloader
            
            # Pastikan permission folder tetap aman
            chown -R www-data:www-data /var/www/ads-aggregator
            chmod -R 755 /var/www/ads-aggregator
            chmod -R 777 application/logs uploads

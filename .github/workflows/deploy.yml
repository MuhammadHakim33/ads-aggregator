name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Masuk ke direktori aplikasi
            cd /var/www/ads-aggregator
            
            # Simpan sementara perubahan lokal di VPS (seperti config.php) agar git pull tidak error
            sudo git stash
            
            # Tarik kode terbaru dari branch main
            sudo git pull origin main
            
            # Kembalikan perubahan lokal (config.php)
            sudo git stash pop || true
            
            # Update dependencies composer tanpa menjalankan script post-install (menghindari error sed)
            sudo composer install --no-dev --optimize-autoloader --no-scripts
            
            # Pastikan permission folder tetap aman menggunakan sudo
            sudo chown -R www-data:www-data /var/www/ads-aggregator
            sudo chmod -R 755 /var/www/ads-aggregator
            sudo chmod -R 777 application/logs uploads

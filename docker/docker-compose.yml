services:
  app:
    build:
      context: ./php
    container_name: ads_aggregator_app
    volumes:
      - ../.:/var/www/html
    environment:
      - CI_ENV=${CI_ENV:-development}
    depends_on:
      - db
    networks:
      - ads_aggregator_network

  webserver:
    image: nginx:alpine
    container_name: ads_aggregator_nginx
    ports:
      - "8080:80"
    volumes:
      - ../.:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ads_aggregator_network

  db:
    image: mysql:8.0
    container_name: ads_aggregator_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ci3_db}
      MYSQL_USER: ${DB_USER:-ci3_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ci3_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ads_aggregator_network

volumes:
  db_data:

networks:
  ads_aggregator_network:
    driver: bridge
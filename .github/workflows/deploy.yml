name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4' 

      - name: 3. Install Dependencies (di dalam GitHub, bukan di VPS)
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-progress

      - name: 4. Copy File ke VPS (Otomatis menimpa versi lama)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/ads-aggregator"
          EXCLUDE: "/.git/, /.github/" 

      - name: 5. Pastikan Permission Aman
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Semua file yang dikirim sudah segar, kita hanya perlu mengamankan ownership-nya
            sudo chown -R www-data:www-data /var/www/ads-aggregator
            sudo chmod -R 755 /var/www/ads-aggregator
            sudo chmod -R 777 /var/www/ads-aggregator/application/logs
            sudo chmod -R 777 /var/www/ads-aggregator/uploads
